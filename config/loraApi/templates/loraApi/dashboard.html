<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lora | Sale Control</title>
  <style>
    :root { --ink:#182326; --muted:#6d7b7d; --line:#dbe3df; --paper:#f5f7f4; --white:#fff; --teal:#087f78; --teal-dark:#075d5a; --coral:#d95f4d; --gold:#d39b32; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:Georgia, 'Times New Roman', serif; }
    .shell { min-height:100vh; background: radial-gradient(circle at 90% 0, #dceee7 0, transparent 34%), linear-gradient(135deg, #f8faf7 0, #edf3ef 100%); }
    header { display:flex; justify-content:space-between; align-items:end; gap:24px; max-width:1180px; margin:auto; padding:42px 28px 30px; }
    .eyebrow { margin:0 0 8px; color:var(--teal); font:700 12px/1.2 Arial,sans-serif; letter-spacing:2px; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px, 5vw, 58px); line-height:.95; letter-spacing:0; font-weight:500; }
    .live { display:flex; align-items:center; gap:8px; color:var(--muted); font:600 12px Arial,sans-serif; text-transform:uppercase; letter-spacing:1px; }
    .dot { width:9px; height:9px; border-radius:50%; background:#36a66e; box-shadow:0 0 0 5px #d6eee1; }
    main { max-width:1180px; margin:auto; padding:0 28px 54px; }
    .stats { display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; margin-bottom:22px; }
    .stat { background:var(--white); border:1px solid var(--line); padding:18px 20px; }
    .stat span { display:block; color:var(--muted); font:700 11px Arial,sans-serif; letter-spacing:1.2px; text-transform:uppercase; }
    .stat strong { display:block; margin-top:7px; font-size:31px; font-weight:500; }
    .workspace { display:grid; grid-template-columns:minmax(0, 1.15fr) minmax(320px, .85fr); gap:20px; align-items:start; }
    .panel { background:var(--white); border:1px solid var(--line); padding:26px; box-shadow:0 12px 35px rgba(28,62,54,.06); }
    .panel h2 { margin:0 0 5px; font-size:25px; font-weight:500; }
    .panel .sub { margin:0 0 22px; color:var(--muted); font:14px/1.5 Arial,sans-serif; }
    form { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    label { display:flex; flex-direction:column; gap:7px; color:#435153; font:700 11px Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; }
    input { width:100%; padding:12px 13px; color:var(--ink); background:#fbfcfa; border:1px solid #cbd7d2; border-radius:2px; outline:none; font:16px Georgia,serif; }
    input:focus { border-color:var(--teal); box-shadow:0 0 0 3px #d9efeb; }
    .wide { grid-column:1/-1; }
    button { grid-column:1/-1; margin-top:5px; padding:14px 18px; color:#fff; background:var(--coral); border:0; border-radius:2px; cursor:pointer; font:700 12px Arial,sans-serif; letter-spacing:1.3px; text-transform:uppercase; }
    button:hover { background:#bd4e3e; }
    button:disabled { opacity:.6; cursor:wait; }
    .notice { min-height:22px; margin-top:14px; font:14px/1.4 Arial,sans-serif; }
    .notice.ok { color:var(--teal-dark); } .notice.error { color:#a53b2e; }
    .queue { margin-top:20px; }
    .queue-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    .queue-head h2 { margin:0; }
    .refresh { padding:8px 11px; color:var(--teal-dark); background:#e1f0eb; font-size:10px; }
    .refresh:hover { background:#cce7df; }
    .rows { display:grid; gap:9px; }
    .row { display:flex; justify-content:space-between; gap:16px; padding:13px 0; border-top:1px solid var(--line); font:14px Arial,sans-serif; }
    .row b { font-family:Georgia,serif; font-size:16px; font-weight:500; }
    .row small { display:block; margin-top:4px; color:var(--muted); }
    .badge { align-self:start; padding:5px 8px; color:#8b651d; background:#fff3d4; font:700 10px Arial,sans-serif; letter-spacing:.8px; text-transform:uppercase; }
    .badge.confirmed { color:#176342; background:#dff2e7; }
    .empty { padding:18px 0 4px; color:var(--muted); font:14px Arial,sans-serif; }
    @media (max-width:760px) { header { display:block; padding-top:28px; } .live { margin-top:20px; } main { padding:0 16px 36px; } .workspace { grid-template-columns:1fr; } .panel { padding:20px; } form { grid-template-columns:1fr; } .wide { grid-column:auto; } button { grid-column:auto; } }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div><p class="eyebrow">Lora operations</p><h1>Sale control</h1></div>
    <div class="live"><i class="dot"></i> Gateway online</div>
  </header>
  <main>
    <section class="stats" aria-label="Queue status">
      <div class="stat"><span>Waiting for branch</span><strong id="pending">{{ pending_count }}</strong></div>
      <div class="stat"><span>Confirmed recently</span><strong id="processed">{{ processed_count }}</strong></div>
    </section>
    <section class="workspace">
      <div class="panel">
        <h2>Cancel a sale</h2>
        <p class="sub">Cancel every product line on an invoice through the selected branch desktop.</p>
        <form id="cancel-form">
          <label>Invoice number<input name="invoice" required autocomplete="off"></label>
          <label>Branch<select name="branch" id="branch" required><option value="">Loading branches...</option></select></label>
          <button id="submit" type="submit">Queue cancellation</button>
        </form>
        <div id="notice" class="notice" role="status"></div>
      </div>
      <div class="panel queue">
        <div class="queue-head"><h2>Branch queue</h2><button class="refresh" id="refresh" type="button">Refresh</button></div>
        <div id="rows" class="rows"><div class="empty">Loading queue...</div></div>
      </div>
    </section>
  </main>
</div>
<script>
  const form = document.querySelector('#cancel-form');
  const notice = document.querySelector('#notice');
  const submit = document.querySelector('#submit');
  const rows = document.querySelector('#rows');
  const branchSelect = document.querySelector('#branch');
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
  async function refreshQueue() {
    try {
      const response = await fetch('/api/main-sync/');
      const data = await response.json();
      document.querySelector('#pending').textContent = data.pending_count ?? 0;
      document.querySelector('#processed').textContent = data.processed_count ?? 0;
      const items = data.pending_deletions ?? [];
      rows.innerHTML = items.length ? items.map(item => `<div class="row"><div><b>${escapeHtml(item.invoice)}</b><small>${escapeHtml(item.branch)} · Whole invoice</small></div><span class="badge">Pending</span></div>`).join('') : '<div class="empty">No cancellations are waiting.</div>';
    } catch (error) { rows.innerHTML = '<div class="empty">Queue unavailable. Try again.</div>'; }
  }
  async function refreshBranches() {
    try {
      const response = await fetch('/api/branches/');
      const data = await response.json();
      const selected = branchSelect.value;
      branchSelect.innerHTML = data.branches?.length
        ? '<option value="">Select connected branch</option>' + data.branches.map(branch => `<option value="${escapeHtml(branch.name)}">${escapeHtml(branch.name)}</option>`).join('')
        : '<option value="">No branches connected</option>';
      if ([...branchSelect.options].some(option => option.value === selected)) branchSelect.value = selected;
    } catch (error) {
      branchSelect.innerHTML = '<option value="">Branches unavailable</option>';
    }
  }
  form.addEventListener('submit', async event => {
    event.preventDefault(); submit.disabled = true; notice.className = 'notice'; notice.textContent = '';
    const payload = Object.fromEntries(new FormData(form));
    try {
      const response = await fetch('/api/cancel-sale/', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Cancellation could not be queued.');
      notice.className = 'notice ok'; notice.textContent = data.message + ' The branch desktop will process it on its next sync.';
      form.reset(); await refreshQueue();
    } catch (error) { notice.className = 'notice error'; notice.textContent = error.message; }
    finally { submit.disabled = false; }
  });
  document.querySelector('#refresh').addEventListener('click', refreshQueue);
  refreshQueue(); refreshBranches(); setInterval(refreshQueue, 8000); setInterval(refreshBranches, 8000);
</script>
</body>
</html>
