services:
  - type: web
    name: lora-api
    runtime: python
    pythonVersion: 3.13
    buildCommand: |
      pip install -r requirements.txt
      python config/manage.py migrate --noinput
      python config/manage.py collectstatic --noinput
    startCommand: |
      cd config && python manage.py migrate --noinput && python manage.py restore_seed_state && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --worker-class sync --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: ALLOWED_HOSTS
        value: loraapi.onrender.com,lora-api.onrender.com
