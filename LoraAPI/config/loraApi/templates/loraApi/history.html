<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lora | Cancellation history</title>
  <style>
    :root { --ink:#182326; --muted:#6d7b7d; --line:#dbe3df; --paper:#f5f7f4; --white:#fff; --teal:#087f78; --teal-dark:#075d5a; --coral:#d95f4d; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:Georgia, 'Times New Roman', serif; }
    .shell { min-height:100vh; background:radial-gradient(circle at 90% 0, #dceee7 0, transparent 34%), linear-gradient(135deg, #f8faf7 0, #edf3ef 100%); }
    header { display:flex; justify-content:space-between; align-items:end; gap:24px; max-width:1180px; margin:auto; padding:42px 28px 30px; }
    .eyebrow { margin:0 0 8px; color:var(--teal); font:700 12px/1.2 Arial,sans-serif; letter-spacing:2px; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px, 5vw, 58px); line-height:.95; font-weight:500; }
    .back { color:var(--teal-dark); font:700 12px Arial,sans-serif; letter-spacing:1px; text-decoration:none; text-transform:uppercase; }
    .logout-form { display:inline; margin-left:16px; }
    .logout-button { padding:0; color:var(--teal-dark); background:none; border:0; font:700 12px Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; }
    .logout-button:hover { color:var(--coral); background:none; }
    main { max-width:1180px; margin:auto; padding:0 28px 54px; }
    .toolbar { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:18px; }
    .toolbar p { margin:0; color:var(--muted); font:14px Arial,sans-serif; }
    .filter { display:flex; gap:10px; flex-wrap:wrap; }
    input, select, button { height:42px; border:1px solid #cbd7d2; border-radius:2px; font:14px Arial,sans-serif; }
    input, select { width:220px; padding:10px 12px; background:var(--white); }
    button { padding:0 15px; color:#fff; background:var(--teal); cursor:pointer; font-weight:700; letter-spacing:.8px; text-transform:uppercase; }
    button:hover { background:var(--teal-dark); }
    .table-wrap { overflow-x:auto; background:var(--white); border:1px solid var(--line); box-shadow:0 12px 35px rgba(28,62,54,.06); }
    table { width:100%; border-collapse:collapse; min-width:650px; }
    th { padding:15px 18px; color:var(--muted); border-bottom:1px solid var(--line); text-align:left; font:700 11px Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; }
    td { padding:17px 18px; border-bottom:1px solid var(--line); font:14px Arial,sans-serif; }
    tr:last-child td { border-bottom:0; }
    td:first-child { font:500 17px Georgia,serif; }
    .empty, .error { padding:28px 18px; color:var(--muted); font:14px Arial,sans-serif; text-align:center; }
    .error { color:#a53b2e; }
    .status { display:inline-block; padding:5px 8px; color:#176342; background:#dff2e7; font:700 10px Arial,sans-serif; letter-spacing:.8px; text-transform:uppercase; }
    @media (max-width:760px) { header { display:block; padding:28px 16px 24px; } .back { display:block; margin-top:20px; } main { padding:0 16px 36px; } .toolbar { display:block; } .filter { margin-top:16px; } input { flex:1; width:auto; } }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div><p class="eyebrow">Lora operations</p><h1>Cancellation history</h1></div>
    <div><a class="back" href="/">Back to sale control</a>{% if user.is_superuser %} <a class="back" href="/users/">User accounts</a>{% endif %}<form method="post" action="/logout/" class="logout-form"><button type="submit" class="logout-button">Sign out</button></form></div>
  </header>
  <main>
    <div class="toolbar">
      <p id="summary">Loading saved cancellations...</p>
      <form class="filter" id="filter-form">
        <select id="branch" name="branch"><option value="">All branches</option></select>
        <input id="invoice" name="invoice" placeholder="Search invoice number" autocomplete="off">
        <button type="submit">Search</button>
      </form>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Invoice number</th><th>Branch</th><th>Deleted by</th><th>Cancelled date</th><th>Deleted rows</th><th>Status</th></tr></thead>
        <tbody id="history"><tr><td colspan="6" class="empty">Loading saved cancellations...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<script>
  const historyBody = document.querySelector('#history');
  const summary = document.querySelector('#summary');
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
  const formatDate = value => new Intl.DateTimeFormat(undefined, {dateStyle:'medium', timeStyle:'short'}).format(new Date(value));
  async function loadHistory() {
    try {
      const branch = document.querySelector('#branch').value.trim();
      const invoice = document.querySelector('#invoice').value.trim();
      const response = await fetch('/api/cancellation-history/?branch=' + encodeURIComponent(branch) + '&invoice=' + encodeURIComponent(invoice));
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'History unavailable.');
      const branchSelect = document.querySelector('#branch');
      const selectedBranch = branchSelect.value;
      branchSelect.innerHTML = '<option value="">All branches</option>' + (data.branches || []).map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join('');
      branchSelect.value = selectedBranch;
      summary.textContent = `${data.count} saved cancellation${data.count === 1 ? '' : 's'}, newest first`;
      historyBody.innerHTML = data.cancellations.length ? data.cancellations.map(item => `<tr><td>${escapeHtml(item.invoice)}</td><td>${escapeHtml(item.branch)}</td><td>${escapeHtml(item.deleted_by)}</td><td>${escapeHtml(formatDate(item.cancelled_at))}</td><td>${item.deleted_rows ?? 'Not reported'}</td><td><span class="status">Confirmed</span></td></tr>`).join('') : '<tr><td colspan="6" class="empty">No cancelled invoices found.</td></tr>';
    } catch (error) {
      summary.textContent = 'History unavailable';
      historyBody.innerHTML = `<tr><td colspan="6" class="error">${escapeHtml(error.message)}</td></tr>`;
    }
  }
  document.querySelector('#filter-form').addEventListener('submit', event => { event.preventDefault(); loadHistory(); });
  loadHistory();
  setInterval(loadHistory, 30000);
</script>
</body>
</html>
